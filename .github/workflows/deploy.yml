name: Build and deploy

# Every push to main builds the browser-only app and publishes it to GitHub
# Pages. Pull requests run the same checks and build, without deploying.
#
# The published app contains no API key: each visitor enters their own in the
# page. This workflow therefore needs no secrets.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Let a deployment that has started finish; only queue behind it.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build for GitHub Pages
        run: npm run build:pages

      - name: Check the build contains no API key
        run: |
          if grep -rIlE 'sk-ant-[A-Za-z0-9_-]{20,}' dist; then
            echo "::error::An Anthropic API key was found in the build output."
            exit 1
          fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
